# DONE [Group: BEAR] BEAR-007: Deploy workflow template (GHCR + platform placeholder)
#
# DoD Budget API — Deployment Workflow
#
# Triggered on push to main (after CI passes) or manually via workflow_dispatch.
# Builds and pushes a Docker image to GitHub Container Registry (GHCR),
# then runs smoke tests against the deployment.
#
# TODO [OH MY]: Fill in deployment secrets (GHCR_TOKEN, platform-specific vars)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Only allow one deployment at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: CI must pass before deploying.
  # Verifies every required check has succeeded on this commit, not just one.
  ci-check:
    name: "Verify CI Passed"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'Lint & Type Check',
              'Test (Python 3.11)',
              'Test (Python 3.12)',
              'Docker Build Validation',
            ];
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            });
            const missing = [];
            for (const name of required) {
              const runs = checks.check_runs.filter(r => r.name === name);
              const ok = runs.some(r => r.conclusion === 'success');
              if (!ok) missing.push(name);
            }
            if (missing.length) {
              core.setFailed(`Required checks did not pass: ${missing.join(', ')}`);
            }

  build-and-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is issued automatically; the job-level `packages: write`
      # permission above is what makes it sufficient to push to GHCR.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }} \
            python -c "from api.app import create_app; print('Import OK')"

  # ── Platform Deployment ──────────────────────────────────────────────────
  # Fly.io, single machine + volume. See docs/HOSTING_DECISION.md for why, and
  # fly.toml for the machine/volume configuration.
  #
  # Until FLY_API_TOKEN is set as a repository secret this job reports the
  # missing credential and exits successfully, so the image still builds and
  # pushes rather than failing every run on main.
  deploy-flyio:
    name: "Deploy to Fly.io"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    outputs:
      url: ${{ steps.target.outputs.url }}
      deployed: ${{ steps.target.outputs.deployed }}
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for deployment credentials
        id: creds
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN is not set — skipping deploy. See docs/HOSTING_DECISION.md §6."
            echo "present=false" >> $GITHUB_OUTPUT
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.creds.outputs.present == 'true'

      - name: Deploy image to Fly
        if: steps.creds.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --wait-timeout 300

      - name: Resolve deployment URL
        id: target
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ "${{ steps.creds.outputs.present }}" != "true" ]; then
            echo "deployed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          APP=$(awk -F'"' '/^app *=/{print $2}' fly.toml)
          echo "url=https://${APP}.fly.dev" >> $GITHUB_OUTPUT
          echo "deployed=true" >> $GITHUB_OUTPUT

  # ── Post-deploy Smoke Tests ──────────────────────────────────────────────
  # Runs against the real deployment. Skipped entirely when the deploy was
  # skipped, so a green check always means the smoke tests actually ran.
  smoke-test:
    name: "Post-deploy Smoke Test"
    runs-on: ubuntu-latest
    needs: deploy-flyio
    if: needs.deploy-flyio.outputs.deployed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke tests
        run: |
          python scripts/smoke_test.py \
            --base-url "${{ needs.deploy-flyio.outputs.url }}" \
            --timeout 30
